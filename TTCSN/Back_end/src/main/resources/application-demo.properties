# ==========================================
# DEMO MODE - Chạy không cần MySQL
# Dùng H2 in-memory + dữ liệu mẫu tự động
# Chạy: mvn spring-boot:run
# Hoặc: mvn spring-boot:run -Dspring-boot.run.profiles=demo
# ==========================================

spring.datasource.url=jdbc:h2:mem:DatLichKham;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
